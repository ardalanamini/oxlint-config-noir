commit-msg:
  parallel: true
  jobs:
    - name: commit message format
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: pnpm run lint:fix {staged_files}
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"
      stage_fixed: true

    - name: type check
      run: pnpm run test:types
