name: CD

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  changelog:
    name: Generate Changelog

    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      prerelease: ${{ steps.changelog.outputs.prerelease }}
      release-id: ${{ steps.changelog.outputs.release-id }}

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Changelog
        uses: ardalanamini/auto-changelog@v5
        id: changelog

  npm:
    name: Publish to NPM

    needs:
      - changelog

    concurrency:
      group: ${{ github.workflow }}-npm-${{ github.ref_name }}
      cancel-in-progress: true

    environment:
      name: npm
      url: https://www.npmjs.com/package/oxlint-config-noir

    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Publish the package
        run: pnpm publish --no-git-checks --tag ${{ needs.changelog.outputs.release-id }}

  release:
    name: Create Release

    needs:
      - changelog
      - npm

    concurrency:
      group: ${{ github.workflow }}-github-${{ github.ref_name }}
      cancel-in-progress: true

    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ needs.changelog.outputs.changelog }}
          prerelease: ${{ needs.changelog.outputs.prerelease }}
