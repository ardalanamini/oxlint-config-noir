name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Build the project
        run: pnpm build

  type-check:
    name: Type check

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Type check the project
        run: pnpm typecheck

  lint:
    name: Lint

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - 24
          - 26

    timeout-minutes: 10

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm with runtime
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
          runtime: node@${{ matrix.node-version }}

      - name: Check code styles
        run: pnpm lint

  ci-summary:
    name: CI Summary

    needs:
      - build
      - type-check
      - lint

    if: ${{ always() && github.event_name == 'pull_request' }}

    runs-on: ubuntu-latest

    steps:
      - name: Check test matrix status
        if: ${{ needs.build.result != 'success' || needs.type-check.result != 'success' || needs.lint.result != 'success' }}
        run: exit 1
